<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark always sits on a void tile, never bare: it is lemon, and a
         light browser tab would swallow it. The .ico is for anything that
         ignores the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is what lets the app paint into the notch and the
         home-indicator area; the safe-area padding in index.css keeps content
         out of them. Without it an installed PWA gets black bars top and
         bottom on every iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0F12" />
    <meta name="color-scheme" content="dark" />

    <!-- Defaults for the recruitment page. src/lib/seo.ts rewrites the
         title, canonical URL and robots rule for each route. -->
    <title>Blorbmart Rider — Earn delivering on campus, paid same day</title>
    <meta
      name="description"
      content="Deliver Blorbmart orders around UNIOSUN, LAUTECH, UNN or OOU between lectures and cash out to your bank the same day. Free to sign up."
    />

    <!-- iOS has no manifest support for these, so they are declared here.
         Without them, a rider who taps "Add to Home Screen" on an iPhone gets
         a Safari bookmark with a screenshot for an icon, not an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blorb Rider" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The recruitment link travels by WhatsApp, so the preview card is the
         first thing a prospective rider sees. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blorbmart Rider" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://rider.blorbmart.com.ng/join" />
    <meta property="og:title" content="Blorbmart Rider — Get paid to move" />
    <meta
      property="og:description"
      content="Deliver Blorbmart orders around your campus between lectures. Cash out to your bank the same day."
    />
    <meta property="og:image" content="https://rider.blorbmart.com.ng/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Blorbmart Rider — deliver on campus and get paid the same day" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@blorbmart" />
    <meta name="twitter:title" content="Blorbmart Rider — Get paid to move" />
    <meta
      name="twitter:description"
      content="Deliver Blorbmart orders around your campus between lectures. Cash out to your bank the same day."
    />
    <meta name="twitter:image" content="https://rider.blorbmart.com.ng/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://rider.blorbmart.com.ng/#app",
            "name": "Blorbmart Rider",
            "url": "https://rider.blorbmart.com.ng/join",
            "description": "Deliver Blorbmart orders around your campus between lectures and cash out the same day.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "inLanguage": "en-NG",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NGN" },
            "publisher": { "@id": "https://www.blorbmart.com.ng/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.blorbmart.com.ng/#organization",
            "name": "Blorbmart",
            "legalName": "Blorbmart Limited",
            "url": "https://www.blorbmart.com.ng/"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces, each doing one job: Space Grotesk sets every numeral and
         headline so money reads like an instrument panel, Plus Jakarta Sans
         sets everything a rider actually reads as prose. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color:#0A0F12">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
