<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark always sits on a void tile, never bare: it is lemon, and a
         light browser tab would swallow it. The .ico is for anything that
         ignores the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover is what lets the app paint into the notch and the
         home-indicator area; the safe-area padding in index.css keeps content
         out of them. Without it an installed PWA gets black bars top and
         bottom on every iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0F12" />
    <meta name="color-scheme" content="dark" />

    <title>Blorbmart Rider — Get paid to move</title>
    <meta
      name="description"
      content="Deliver Blorbmart orders around your campus between lectures. Cash out to your bank the same day."
    />

    <!-- iOS has no manifest support for these, so they are declared here.
         Without them, a rider who taps "Add to Home Screen" on an iPhone gets
         a Safari bookmark with a screenshot for an icon, not an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blorb Rider" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta property="og:title" content="Blorbmart Rider — Get paid to move" />
    <meta
      property="og:description"
      content="Deliver Blorbmart orders around your campus between lectures. Cash out to your bank the same day."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces, each doing one job: Space Grotesk sets every numeral and
         headline so money reads like an instrument panel, Plus Jakarta Sans
         sets everything a rider actually reads as prose. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background-color:#0A0F12">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
